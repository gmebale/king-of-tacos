server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Cache static assets, fall back to SPA for unknown paths
  location ~* \.(?:css|js|gif|jpe?g|png|webp|woff2?)$ {
    try_files $uri /index.html;
    expires 7d;
    access_log off;
  }
}


services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-kot-api:local}
    build: ./kot-backend
    env_file:
      - ./kot-backend/.env.production
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
  uploads_data:

